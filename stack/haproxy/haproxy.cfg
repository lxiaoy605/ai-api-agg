global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# 统计页面
listen stats
    bind *:8081
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin
    stats realm HAProxy\ Statistics

# 统一入口 — nginx 做 path 路由，haproxy 做蓝绿负载均衡
frontend app_frontend
    bind *:8080
    mode http
    option forwardfor
    # /api/* → oneapi；其他 → backend
    acl is_api path_beg /api/
    use_backend oneapi_pool if is_api
    default_backend backend_pool

backend oneapi_pool
    mode http
    balance roundrobin
    option httpchk GET /api/status
    http-check expect status 200
    server oneapi-blue oneapi-blue:3000 check inter 5s rise 2 fall 3
    server oneapi-green oneapi-green:3000 check inter 5s rise 2 fall 3

backend backend_pool
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server backend-blue backend-blue:8080 check inter 5s rise 2 fall 3
    server backend-green backend-green:8080 check inter 5s rise 2 fall 3
