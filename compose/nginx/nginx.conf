# =============================================
# AI API 聚合平台 — Nginx 生产级反向代理配置
# =============================================
#
# 架构：
#   /v1/*  → OneAPI 网关（模型调用，OpenAI 兼容）
#   /api/* → 后端管理 API（Go 服务，端口 8080）
#   /      → 前端静态资源（Next.js standalone）
#
# 安全目标：SSL Labs A+
# =============================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

# 错误日志
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept       on;
    use                epoll;
}

http {
    # ==========================================
    # 基础设置
    # ==========================================
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 隐藏 Nginx 版本号（安全加固）
    server_tokens off;

    # ==========================================
    # 日志
    # ==========================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    # ==========================================
    # 性能调优
    # ==========================================
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  100;
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # ==========================================
    # Gzip 压缩
    # ==========================================
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/x-javascript
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        image/svg+xml
        image/x-icon
        font/ttf
        font/otf
        font/opentype;
    gzip_disable "msie6";

    # ==========================================
    # 限流规则
    # ==========================================
    # API 路由：100 req/s（$binary_remote_addr 按客户端 IP）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # 认证路由：5 req/s（防暴力破解）
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # 通用路由：30 req/s
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # 连接数限制（每 IP 最多 20 个并发连接）
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ==========================================
    # 上游定义
    # ==========================================
    # OneAPI 网关（模型调用）
    upstream oneapi_upstream {
        server haproxy:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # 后端管理 API（Go 服务）
    upstream backend_upstream {
        server haproxy:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # 前端 Next.js（standalone 模式）
    upstream frontend_upstream {
        server host.docker.internal:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # ==========================================
    # HSTS 头（仅 HTTPS 时下发）
    # ==========================================
    map $scheme $hsts_header {
        https "max-age=63072000; includeSubDomains; preload";
    }

    # ==========================================
    # 加载站点配置（conf.d/ 目录）
    # ==========================================
    # *.conf — 直接加载（如 http.conf）
    # *.template — 由 docker-entrypoint.sh 通过 envsubst 处理生成 .conf 后加载
    include /etc/nginx/conf.d/*.conf;
}
