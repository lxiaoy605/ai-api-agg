# ==========================================
# HTTP 服务 — Certbot 验证 + HTTPS 重定向
# ==========================================
# 此配置始终生效，不依赖 SSL 证书
# 用途：
#   1. 提供 /.well-known/acme-challenge/ 供 Certbot 验证
#   2. 其余所有请求 301 重定向到 HTTPS
# ==========================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Certbot HTTP-01 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        access_log off;
    }

    # 健康检查（不记录日志）
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # 其他全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
