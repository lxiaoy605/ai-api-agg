! =============================================
! Keepalived 配置 — AI API 聚合平台 VIP 高可用
! =============================================
! 依赖: 2 台 VPS 组成 VRRP 集群
! 虚拟 IP 在 Master 宕机时自动漂移到 Backup
!
! 环境变量占位符（由 setup-keepalived.sh 替换）:
!   ${KEEPALIVED_VIP}   — 虚拟 IP 地址（如 10.0.0.100/24）
!   ${KEEPALIVED_ROLE}  — 角色: MASTER 或 BACKUP
!   ${KEEPALIVED_PRIORITY} — 优先级: MASTER=100, BACKUP=50
!   ${KEEPALIVED_INTERFACE} — 网卡接口（如 eth0）
! =============================================

global_defs {
    # 邮件通知（可选，MVP 阶段用脚本通知）
    notification_email {
        admin@aiflowhub.ai
    }
    notification_email_from keepalived@aiflowhub.ai
    smtp_server 127.0.0.1
    smtp_connect_timeout 30

    # VRRP 实例标识
    router_id AI_API_AGG_HA

    # 脚本执行用户
    script_user root
    enable_script_security
}

# =============================================
# HAProxy 健康检查脚本
# =============================================
vrrp_script chk_haproxy {
    script "/usr/local/bin/check-haproxy.sh"
    interval 3       # 每 3 秒检查一次
    weight -20       # 失败时降低 20 优先级
    fall 3           # 连续 3 次失败视为宕机
    rise 2           # 连续 2 次成功视为恢复
    timeout 2
}

# =============================================
# VRRP 实例 — API 网关 VIP
# =============================================
vrrp_instance VI_API_GATEWAY {
    # 角色: MASTER 或 BACKUP（由环境变量决定）
    state ${KEEPALIVED_ROLE}

    # 网卡接口
    interface ${KEEPALIVED_INTERFACE}

    # VRRP 路由器 ID（两台机器必须相同）
    virtual_router_id 51

    # 优先级: Master=100, Backup=50
    priority ${KEEPALIVED_PRIORITY}

    # 通告间隔（秒）
    advert_int 1

    # 抢占模式：MASTER 恢复后自动夺回 VIP
    nopreempt

    # 认证（两台机器必须相同）
    authentication {
        auth_type PASS
        auth_pass AiFlowHub2026!
    }

    # 虚拟 IP 地址
    virtual_ipaddress {
        ${KEEPALIVED_VIP}
    }

    # 健康检查脚本
    track_script {
        chk_haproxy
    }

    # =========================================
    # 状态转换通知脚本
    # =========================================
    # Master → Backup (故障转移)
    notify /usr/local/bin/keepalived-notify.sh backup

    # Backup → Master (恢复)
    notify_master /usr/local/bin/keepalived-notify.sh master

    # 故障时执行
    notify_fault /usr/local/bin/keepalived-notify.sh fault

    # VRRP 进程停止时执行
    notify_stop /usr/local/bin/keepalived-notify.sh stop
}
