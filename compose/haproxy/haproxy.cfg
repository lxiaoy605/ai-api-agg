# =============================================
# HAProxy 配置 — AI API 聚合平台蓝绿部署
# =============================================
# 镜像: haproxy:3-alpine
# 挂载: ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
# =============================================

global
    log stdout format raw local0 info
    maxconn 8192
    tune.ssl.default-dh-param 2048
    # Unix socket 用于运行时管理（切换权重、统计查询）
    # stats socket disabled (WSL perms)
    stats timeout 2m
    # 以非特权用户运行
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option redispatch
    option http-keep-alive
    timeout connect 5000ms
    timeout client 60000ms
    timeout server 60000ms
    timeout check 5000ms
    retries 3

# =============================================
# 前端: API 入口 (外部)
# =============================================
frontend api_front
    bind 0.0.0.0:8080
    # 请求日志：捕获 User-Agent 和 Authorization 前缀
    capture request header User-Agent len 64
    capture request header Authorization len 16

    # === Go 后端路由（优先匹配）===
    # 健康检查
    acl is_backend path /health

    # 认证相关
    acl is_backend path_beg /auth/
    acl is_backend path_beg /api-keys/

    # 支付相关
    acl is_backend path_beg /api/payment/

    # 管理相关（精确匹配，避免与 OneAPI /api/* 冲突）
    acl is_backend path /api/stats
    acl is_backend path /api/topup
    acl is_backend path /api/channels
    acl is_backend path /api/audit-log
    acl is_backend path /api/backup
    acl is_backend path /api/restore

    use_backend backend_pool if is_backend

    # 其他所有流量 → OneAPI 池
    default_backend oneapi_pool

# =============================================
# 前端: 内部管理 + 状态页
# =============================================
frontend mgmt_front
    bind 0.0.0.0:8081
    # HAProxy 内置状态页面
    stats enable
    stats uri /stats
    stats realm HAProxy\ Stats
    stats auth admin:${HAPROXY_STATS_PASSWORD:-admin123}
    stats refresh 10s
    stats show-legends
    stats show-node

    # HAProxy 自身存活检查
    acl is_health path /health
    http-request return status 200 content-type "text/plain" string "OK" if is_health

    # Keepalived 健康检查
    acl is_status path /status
    http-request return status 200 content-type "text/plain" string "OK" if is_status

# =============================================
# 后端: Go 后端蓝绿实例池
# =============================================
backend backend_pool
    balance roundrobin
    # 使用 Go 后端 /health 端点进行健康检查
    option httpchk GET /health
    http-check expect status 200

    # Blue 实例 — 生产流量 (active, weight=100)
    server backend-blue backend-blue:8080 check inter 10s fall 3 rise 2 weight 100

    # Green 实例 — 热备 (standby, weight=0)
    server backend-green backend-green:8080 check inter 10s fall 3 rise 2 weight 0

# =============================================
# 后端: OneAPI 蓝绿实例池
# =============================================
backend oneapi_pool
    balance roundrobin
    # 使用 OneAPI 内置 /api/status 端点进行健康检查
    option httpchk GET /api/status
    http-check expect status 200

    # Blue 实例 — 生产流量 (active, weight=100)
    server oneapi-blue oneapi-blue:3000 check inter 10s fall 3 rise 2 weight 100

    # Green 实例 — 热备 (standby, weight=0)
    # 保持在线但无流量，切换时可瞬间提升权重
    server oneapi-green oneapi-green:3000 check inter 10s fall 3 rise 2 weight 0
