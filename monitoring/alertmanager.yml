# Alertmanager 配置 — AI API 聚合平台
# 通过 Telegram 推送基础设施告警（服务宕机、错误率飙升等）
# 使用与业务通知相同的 Bot（TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID）
# alertmanager-entrypoint.sh 在容器启动时用 envsubst 替换占位符

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 30m
  receiver: 'telegram-warning'

  routes:
    - match:
        severity: critical
      receiver: 'telegram-critical'
      group_wait: 5s
      group_interval: 2m
      repeat_interval: 15m

    - match:
        severity: warning
      receiver: 'telegram-warning'

inhibit_rules:
  - source_match:
      alertname: 'ai_api_agg_service_down'
    target_match_re:
      alertname: 'ai_api_agg_high_error_rate|ai_api_agg_high_latency_.*'
    equal: ['job']

  - source_match:
      severity: 'critical'
      alertname: 'ai_api_agg_high_latency_critical'
    target_match:
      severity: 'warning'
      alertname: 'ai_api_agg_high_latency_warning'
    equal: ['job']

receivers:
  - name: 'telegram-critical'
    telegram_configs:
      - send_resolved: true
        bot_token: '${TELEGRAM_BOT_TOKEN:-YOUR_BOT_TOKEN_HERE}'
        chat_id: ${TELEGRAM_CHAT_ID:-YOUR_CHAT_ID_HERE}
        parse_mode: 'HTML'
        message: |
          🔴 <b>{{ .CommonLabels.alertname }}</b>
          <b>Severity:</b> {{ .CommonLabels.severity }}
          <b>Description:</b> {{ .CommonAnnotations.description }}
          {{- if .CommonAnnotations.summary }}
          <b>Summary:</b> {{ .CommonAnnotations.summary }}
          {{- end }}

  - name: 'telegram-warning'
    telegram_configs:
      - send_resolved: true
        bot_token: '${TELEGRAM_BOT_TOKEN:-YOUR_BOT_TOKEN_HERE}'
        chat_id: ${TELEGRAM_CHAT_ID:-YOUR_CHAT_ID_HERE}
        parse_mode: 'HTML'
        message: |
          🟡 <b>{{ .CommonLabels.alertname }}</b>
          <b>Severity:</b> {{ .CommonLabels.severity }}
          <b>Description:</b> {{ .CommonAnnotations.description }}
