# Alertmanager 配置 — AI API 聚合平台
# 开发环境：无外部通知渠道，所有告警通过自身日志输出
# 生产环境：取消注释 Telegram 配置段并填入实际 Token/Chat ID

global:
  # 全局配置不在此层放 send_resolved

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 30m
  receiver: 'dev-null'

  routes:
    - match:
        severity: critical
      receiver: 'dev-null'
      group_wait: 5s
      group_interval: 2m
      repeat_interval: 15m

    - match:
        severity: warning
      receiver: 'dev-null'

inhibit_rules:
  - source_match:
      alertname: 'ai_api_agg_service_down'
    target_match_re:
      alertname: 'ai_api_agg_high_error_rate|ai_api_agg_high_latency_.*'
    equal: ['job']

  - source_match:
      severity: 'critical'
      alertname: 'ai_api_agg_high_latency_critical'
    target_match:
      severity: 'warning'
      alertname: 'ai_api_agg_high_latency_warning'
    equal: ['job']

receivers:
  # 开发环境：空接收器，告警仅通过 --log.level=debug 输出到日志
  - name: 'dev-null'

  # 生产环境取消注释以下 Telegram 配置段：
  #
  # - name: 'telegram-critical'
  #   telegram_configs:
  #     - send_resolved: true
  #       bot_token: 'YOUR_BOT_TOKEN'
  #       chat_id: 123456789
  #       parse_mode: 'HTML'
  #       message: |
  #         <b>{{ .CommonLabels.alertname }}</b>
  #         {{ .CommonAnnotations.description }}
  #
  # - name: 'telegram-warning'
  #   telegram_configs:
  #     - send_resolved: true
  #       bot_token: 'YOUR_BOT_TOKEN'
  #       chat_id: 123456789
  #       parse_mode: 'HTML'
