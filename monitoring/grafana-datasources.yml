# =============================================
# Grafana 数据源配置 — Prometheus
# =============================================
# Grafana 启动时自动加载此数据源，无需手动配置

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "30s"
      httpMethod: "POST"
      manageAlerts: true
      alertmanagerUid: "alertmanager"
